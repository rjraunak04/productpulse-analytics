funnel_contract:
  version: 1
  name: ecommerce_session_funnel
  entity: session
  session_key:
    - user_pseudo_id
    - ga_session_id
  ordered: true
  same_session_required: true
  allow_intermediate_events: true
  stages:
    - session_start
    - view_item
    - add_to_cart
    - begin_checkout
    - purchase

measurement:
  entry_population: valid sessions containing session_start
  progression_rule: each next stage must occur at or after the prior matched stage
  timestamp_tie_policy: event ordering also uses bundle sequence and batch event index
  conversion_denominator: prior_reached_stage
  overall_conversion_denominator: stage_1_sessions
  dropoff: prior_stage_sessions_minus_current_stage_sessions
  zero_denominator: null

segments:
  - device_category
  - country
  - first_user_source
  - first_user_medium

guardrails:
  presence_flags_are_not_ordered_conversion: true
  first_user_source_is_not_session_attribution: true
  sessions_missing_composite_key_are_excluded: true
